name: Android CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish tested APK (e.g. v0.3.0); leave empty for CI only'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # AGP downloads a missing platform / build-tools automatically; the runner image
  # already ships the Android SDK at $ANDROID_SDK_ROOT.
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  test:
    name: Test (unit tests + IR reference vectors)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify NEC reference vectors
        run: python3 tools/verify_nec_reference.py

      - name: Check resource / binding / package consistency
        run: python3 tools/check_project_consistency.py

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee gradle.log

      - name: Report failures as annotations
        if: failure()
        run: python3 tools/report_ci_failure.py gradle.log

      - name: Summarise unit test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re
          import sys

          results = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          rows = []
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}

          for path in results:
              head = open(path, encoding="utf-8").read(4000)
              tag = re.search(r"<testsuite[^>]*>", head)
              if not tag:
                  continue
              tag = tag.group(0)

              def number(name):
                  found = re.search(name + r'="(\d+)"', tag)
                  return int(found.group(1)) if found else 0

              counts = {key: number(key) for key in totals}
              for key, value in counts.items():
                  totals[key] += value
              rows.append((os.path.basename(path), counts))

          lines = ["| test class | tests | failures | errors | skipped |", "| --- | --- | --- | --- | --- |"]
          lines += [
              "| `{name}` | {tests} | {failures} | {errors} | {skipped} |".format(name=name, **counts)
              for name, counts in rows
          ]
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("## Unit tests\n\n")
                  summary.write("\n".join(lines))
                  summary.write(
                      "\n\n**Total: {tests} tests, {failures} failures, {errors} errors, "
                      "{skipped} skipped**\n".format(**totals)
                  )

          print(
              "TESTS total={tests} failures={failures} errors={errors} skipped={skipped} "
              "classes={classes}".format(classes=len(rows), **totals)
          )
          if totals["tests"] == 0:
              sys.exit("no unit tests were executed")
          if totals["failures"] or totals["errors"]:
              sys.exit("unit test failures or errors")
          PY

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle.log

      - name: Report failures as annotations
        if: failure()
        run: python3 tools/report_ci_failure.py gradle.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: walton-wrc03-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  # Pushing a `v*` tag publishes an installable, signed release APK as a GitHub release.
  release:
    name: Release APK
    runs-on: ubuntu-latest
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    permissions:
      contents: write
    steps:
      - name: Checkout (full history, for the changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release identity
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          VERSION_NAME="$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)"
          test "$TAG" = "v${VERSION_NAME%-unverified}"
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      # Uses the repository keystore when it is stored in secrets, otherwise generates a
      # throwaway one so the APK is still signed and sideloadable.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "::notice::Signing with the keystore from repository secrets."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_SOURCE=repository keystore (secrets)" >> "$GITHUB_ENV"
          else
            echo "::notice::No keystore secret - generating an ephemeral key for this sideload build."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias wrc03 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass wrc03sideload -keypass wrc03sideload \
              -dname "CN=Walton WRC-03 IR Remote, OU=Community Build, O=azahar4bd, L=Dhaka, C=BD"
            echo "RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=wrc03sideload" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=wrc03" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=wrc03sideload" >> "$GITHUB_ENV"
            echo "SIGNING_SOURCE=ephemeral CI key (sideload only)" >> "$GITHUB_ENV"
          fi

      - name: Assemble release APK
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --stacktrace \
            -PreleaseKeystorePath="$RELEASE_KEYSTORE_PATH" \
            -PreleaseStorePassword="$RELEASE_STORE_PASSWORD" \
            -PreleaseKeyAlias="$RELEASE_KEY_ALIAS" \
            -PreleaseKeyPassword="$RELEASE_KEY_PASSWORD" \
            2>&1 | tee gradle.log

      - name: Report failures as annotations
        if: failure()
        run: python3 tools/report_ci_failure.py gradle.log

      - name: Package and checksum the APK
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          APK="walton-wrc03-${VERSION}.apk"

          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_BYTES=$(stat -c%s "$APK")" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"

          sha256sum "$APK" > "$APK.sha256"

          # Never publish an APK without verifying its signing certificate.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER=""
          if [ -n "$SDK" ] && [ -d "$SDK/build-tools" ]; then
            APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -1 || true)"
          fi
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK"
            echo "APK_SIGNATURE=verified with apksigner" >> "$GITHUB_ENV"
          else
            echo "::error::apksigner missing; refusing to publish an unchecked APK"
            exit 1
          fi

      - name: Write release notes
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          PREVIOUS="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$PREVIOUS" ]; then
            RANGE="${PREVIOUS}..HEAD"
          else
            RANGE="HEAD"
          fi
          CHANGES="$(git log --no-merges --pretty='- %s' "$RANGE")"
          VERSION_NAME="$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)"

          if [[ "$SIGNING_SOURCE" == ephemeral* ]]; then
            SIGNING_NOTE="Ephemeral CI key: an older APK may need to be uninstalled before installing this one (uninstalling removes saved codes). Future builds will not share this key."
          else
            SIGNING_NOTE="Signed with the repository keystore. Updates require the same signing certificate."
          fi

          cat > notes.md <<EOF
          ## ওয়ালটন WRC-03 IR রিমোট — ${APK_VERSION}

          Walton WRC-03 ও VEON (Veon_2445 / xm_1_4375) প্রোফাইলসহ native Kotlin IR রিমোট। ফোনের IR blaster দিয়ে সরাসরি
          38 kHz NEC (6122 ফ্যামিলি) সিগন্যাল যায় — কোনো সার্ভার বা ইন্টারনেট লাগে না।

          ### ইনস্টল
          1. নিচের **${APK_PATH}** ডাউনলোড করুন।
          2. ফোনে ফাইলটি খুলুন; “অজানা অ্যাপ ইনস্টল” অনুমতি চাইলে দিয়ে দিন।
          3. অ্যাপ খুলে উপরের স্ট্যাটাস কার্ডে দেখে নিন ফোনে IR blaster আছে কিনা।

          ### এই সংস্করণে
          - VEON NEC 0x08 প্রোফাইল: উৎসভিত্তিক ২৬টি বাটন; অজানা কোড বানিয়ে দেওয়া হয়নি।
          - VEON স্ক্যানে নির্বাচিত বাটনের পরিচিত কোড আগে, তারপর পুরো ২৫৬ বাইট।
          - স্ক্যানের ফল বাটন/প্রিসেট বদলালেও থাকে; ঠিকানাভিত্তিক সংরক্ষণে Walton ও VEON কোড আলাদা।
          - প্রোফাইল মনে রাখা, স্ক্যানে পাওয়া নতুন ঠিকানা ব্যবহার, ব্যর্থ সিগন্যাল সংরক্ষণ রোধ।

          ${CHANGES}

          ### ⚠️ কোড টেবিল যাচাই করা হয়নি
          বাটন-কোডগুলো কমিউনিটি কোড শিট ও কিছু অনুমান থেকে নেওয়া (অ্যাপ ভার্সন \`${VERSION_NAME}\`)।
          কোনো বাটন কাজ না করলে অ্যাপের **কোড স্ক্যান মোড** চালান: সম্ভাব্য NEC কোড একে একে
          পাঠানো হয়। শুধু নির্বাচিত কাজটি ঘটলেই নিশ্চিত করুন ও সংরক্ষণ করুন। অজানা কোডে
          সেটিংস বা ভলিউম বদলাতে পারে; নজর রাখুন। বাস্তব টিভিতে পরীক্ষা হয়নি।

          ### বিল্ড তথ্য
          | | |
          | --- | --- |
          | ফাইল | \`${APK_PATH}\` |
          | আকার | ${APK_BYTES} বাইট |
          | SHA-256 | \`${APK_SHA256}\` |
          | স্বাক্ষর | ${SIGNING_SOURCE} — ${APK_SIGNATURE} |
          | minSdk / targetSdk | 23 / 35 |

          > ${SIGNING_NOTE}
          EOF

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          TITLE="ওয়ালটন WRC-03 IR রিমোট ${APK_VERSION}"

          # Do not replace an existing public release or attach a build to the wrong tag.
          gh release create "$TAG" "$APK_PATH" "$APK_PATH.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file notes.md

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Summarise
        run: |
          set -euo pipefail
          {
            echo "## Release ${RELEASE_TAG}"
            echo
            echo "- APK: \`${APK_PATH}\` (${APK_BYTES} bytes)"
            echo "- SHA-256: \`${APK_SHA256}\`"
            echo "- Signing: ${SIGNING_SOURCE} (${APK_SIGNATURE})"
            echo "- Download: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
