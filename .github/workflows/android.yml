name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (unit tests + IR reference vectors)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Probe Android SDK layout  # TEMPORARY DIAGNOSTIC
        run: |
          set -uo pipefail
          echo "::warning::ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-UNSET}"
          echo "::warning::ANDROID_HOME=${ANDROID_HOME:-UNSET}"
          for dir in /usr/local/lib/android/sdk /opt/android/sdk "$HOME/Android/Sdk"; do
            if [ -d "$dir" ]; then
              echo "::warning::found sdk dir: $dir"
              ls -1 "$dir" | head -20 | while read -r entry; do echo "::warning::$dir entry: $entry"; done
              ls -1 "$dir/platforms" 2>/dev/null | while read -r entry; do echo "::warning::$dir platform: $entry"; done
              ls -1 "$dir/build-tools" 2>/dev/null | while read -r entry; do echo "::warning::$dir build-tools: $entry"; done
              ls -1 "$dir/cmdline-tools" 2>/dev/null | while read -r entry; do echo "::warning::$dir cmdline-tools: $entry"; done
            fi
          done
          command -v sdkmanager >/dev/null 2>&1 && echo "::warning::sdkmanager on PATH" || echo "::warning::sdkmanager NOT on PATH"
          exit 0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest
      - name: Verify NEC reference vectors
        run: python3 tools/verify_nec_reference.py

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub runner images already ship the Android SDK; just make sure the
      # platform/build-tools this project compiles against are present.
      - name: Skip explicit SDK install for now  # TEMPORARY
        run: echo "relying on the preinstalled SDK"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: walton-wrc03-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
